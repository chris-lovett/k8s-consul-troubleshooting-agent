# Consul Enterprise Secure UI Deployment - Helm Values
# Target: OpenShift 4.19, Consul Enterprise 1.21


global:
  # Datacenter name
  datacenter: dc1
  
  # Consul image
  image: "hashicorp/consul-enterprise:1.21.0-ent"
  imageK8S: "hashicorp/consul-k8s-control-plane:1.5.0"
  
  # Enterprise license (required)
  enterpriseLicense:
    secretName: "consul-enterprise-license"
    secretKey: "key"
    enableLicenseAutoload: true
  
  # Domain for Consul services
  domain: consul
  
  # Enable Consul namespaces (Enterprise feature)
  enableConsulNamespaces: true
  
  # ACL Configuration (MANDATORY for production)
  acls:
    manageSystemACLs: true
    
    # Bootstrap token from secret
    bootstrapToken:
      secretName: "consul-bootstrap-token"
      secretKey: "token"
    
    # Create replication token for multi-DC
    createReplicationToken: true
    
    # Partition token (Enterprise)
    partitionToken:
      secretName: "consul-partition-token"
      secretKey: "token"
  
  # TLS Configuration (MANDATORY for production)
  tls:
    enabled: true
    
    # HTTPS only - no HTTP
    httpsOnly: true
    
    # Enable auto-encrypt for automatic certificate distribution
    enableAutoEncrypt: true
    
    # Verify TLS certificates
    verify: true
    
    # Minimum TLS version
    minVersion: "TLSv1_3"
    
    # Cipher suites (TLS 1.3)
    cipherSuites:
      - "TLS_AES_128_GCM_SHA256"
      - "TLS_AES_256_GCM_SHA384"
      - "TLS_CHACHA20_POLY1305_SHA256"
    
    # CA certificate
    caCert:
      secretName: "consul-ca-cert"
      secretKey: "tls.crt"
    
    # CA key for auto-encrypt
    caKey:
      secretName: "consul-ca-cert"
      secretKey: "tls.key"
  
  # Gossip encryption (MANDATORY for production)
  gossipEncryption:
    secretName: "consul-gossip-encryption-key"
    secretKey: "key"
  
  # Metrics configuration
  metrics:
    enabled: true
    enableAgentMetrics: true
    enableGatewayMetrics: true
    
    # Prometheus integration
    enableTelemetryCollector: true
    
    # Datadog integration (optional)
    # datadogIntegration:
    #   enabled: false
  
  # Federation (for multi-cluster)
  federation:
    enabled: false
  
  # Image pull secrets (if using private registry)
  # imagePullSecrets:
  #   - name: "consul-enterprise-license"
  
  # OpenShift specific settings
  openshift:
    enabled: true

# Consul Server Configuration
server:
  # Enable Consul servers
  enabled: true
  
  # Number of server replicas (must be odd number: 3, 5, or 7)
  replicas: 3
  
  # Server image
  image: null  # Uses global.image
  
  # Bootstrap expect (should match replicas)
  bootstrapExpect: 3
  
  # Enterprise license
  enterpriseLicense:
    secretName: "consul-enterprise-license"
    secretKey: "key"
  
  # Storage configuration
  storage: 50Gi
  storageClass: "gp3-csi"  # Adjust for your OpenShift storage class
  
  # Resource limits (production sizing)
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  
  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: "OnRootMismatch"
  
  # Pod security context
  containerSecurityContext:
    server:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
  
  # Update strategy
  updatePartition: 0
  
  # Disruption budget
  disruptionBudget:
    enabled: true
    maxUnavailable: 1
  
  # Extra configuration
  extraConfig: |
    {
      "log_level": "INFO",
      "log_json": true,
      "audit": {
        "enabled": true,
        "sink": {
          "file": {
            "path": "/consul/data/audit/audit.log",
            "delivery_guarantee": "best-effort",
            "rotate_duration": "24h",
            "rotate_max_files": 90,
            "rotate_bytes": 26214400,
            "mode": "0600"
          }
        }
      },
      "telemetry": {
        "prometheus_retention_time": "60s",
        "disable_hostname": false
      },
      "limits": {
        "http_max_conns_per_client": 200,
        "https_handshake_timeout": "5s",
        "rpc_max_conns_per_client": 100,
        "rpc_rate": 100,
        "kv_max_value_size": 524288
      },
      "performance": {
        "raft_multiplier": 1
      }
    }
  
  # Extra volumes for audit logs
  extraVolumes:
    - type: "secret"
      name: "consul-ca-cert"
      load: false
  
  # Affinity rules (spread across nodes)
  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: {{ template "consul.name" . }}
              release: "{{ .Release.Name }}"
              component: server
          topologyKey: kubernetes.io/hostname
  
  # Tolerations (if needed for dedicated nodes)
  # tolerations: []
  
  # Node selector (if needed for dedicated nodes)
  # nodeSelector: {}
  
  # Service annotations
  service:
    annotations: |
      "service.beta.openshift.io/serving-cert-secret-name": "consul-server-cert"
  
  # Snapshot agent (Enterprise feature)
  snapshotAgent:
    enabled: true
    interval: "1h"
    retain: 336  # 14 days
    
    # S3 configuration for snapshots
    configSecret:
      secretName: "consul-snapshot-config"
      secretKey: "config"
  
  # Autopilot configuration
  autopilot:
    enabled: true
    cleanupDeadServers: true
    lastContactThreshold: "200ms"
    maxTrailingLogs: 250
    minQuorum: 0
    serverStabilizationTime: "10s"

# Consul Client Configuration
client:
  enabled: true
  
  # Run clients as DaemonSet
  daemonSet: true
  
  # Resource limits
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  
  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 1000
    fsGroup: 1000
  
  containerSecurityContext:
    client:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
  
  # Extra configuration
  extraConfig: |
    {
      "log_level": "INFO",
      "log_json": true
    }
  
  # Tolerations to run on all nodes
  tolerations: |
    - operator: "Exists"

# Consul UI Configuration
ui:
  # Enable UI
  enabled: true
  
  # Service type
  service:
    enabled: true
    type: "ClusterIP"
    port:
      http: 8500
      https: 8443
    annotations: |
      "service.beta.openshift.io/serving-cert-secret-name": "consul-ui-cert"
  
  # Ingress configuration (we'll use OpenShift Route instead)
  ingress:
    enabled: false
  
  # Metrics configuration
  metrics:
    # DISABLE built-in proxy for production (security best practice)
    enabled: false
    
    # Provider (if proxy enabled)
    provider: "prometheus"
    
    # Base URL (if proxy enabled)
    # baseURL: "http://prometheus.monitoring.svc.cluster.local:9090"
  
  # Dashboard URL templates (RECOMMENDED approach)
  dashboardURLTemplates:
    service: "https://grafana.your-domain.com/d/consul-service-overview/consul-service-overview?var-service={{Service.Name}}&var-namespace={{Service.Namespace}}&var-partition={{Service.Partition}}&var-datacenter={{Datacenter}}"
  
  # Resource limits
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  
  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 1000
    fsGroup: 1000
  
  containerSecurityContext:
    ui:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
  
  # Replicas for HA
  replicas: 2
  
  # Pod disruption budget
  disruptionBudget:
    enabled: true
    maxUnavailable: 1

# Connect Inject Configuration
connectInject:
  enabled: true
  
  # Default inject behavior
  default: false  # Require explicit annotation
  
  # Transparent proxy
  transparentProxy:
    defaultEnabled: true
  
  # Metrics
  metrics:
    defaultEnabled: true
    defaultEnableMerging: true
    defaultMergedMetricsPort: 20100
    defaultPrometheusScrapePort: 20200
    defaultPrometheusScrapePath: "/metrics"
  
  # ACL binding rule
  aclBindingRuleSelector: "serviceaccount.name!=default"
  
  # Resource limits for injected sidecars
  sidecarProxy:
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
  
  # Init container resources
  initContainer:
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

# Mesh Gateway Configuration (for multi-cluster)
meshGateway:
  enabled: false
  replicas: 2
  
  # Service type
  service:
    enabled: true
    type: "LoadBalancer"
    port: 443
  
  # Resource limits
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Ingress Gateway Configuration
ingressGateways:
  enabled: false
  defaults:
    replicas: 2
    service:
      type: "LoadBalancer"
      ports:
        - port: 8080
        - port: 8443
  
  # Gateway instances
  gateways:
    - name: ingress-gateway

# Terminating Gateway Configuration
terminatingGateways:
  enabled: false
  defaults:
    replicas: 2
  
  # Gateway instances
  gateways:
    - name: terminating-gateway

# API Gateway Configuration (Consul 1.15+)
apiGateway:
  enabled: false
  image: "hashicorp/consul-api-gateway:0.5.0"
  managedGatewayClass:
    enabled: true

# Prometheus Integration
prometheus:
  enabled: true

# Tests
tests:
  enabled: true

# Telemetry Collector (Enterprise)
telemetryCollector:
  enabled: true
  image: "hashicorp/consul-telemetry-collector:0.0.1"
  
  # Resource limits
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Webhook Certificate Manager
webhookCertManager:
  tolerations: |
    - operator: "Exists"

# Global annotations
global:
  annotations: |
    "app.kubernetes.io/managed-by": "Helm"
    "app.kubernetes.io/part-of": "consul"
    "app.kubernetes.io/version": "1.21.0"

# DNS Configuration
dns:
  enabled: true
  enableRedirection: true
  
  # Proxy configuration
  proxy:
    enabled: true

# Sync Catalog (for legacy integration)
syncCatalog:
  enabled: false
  toConsul: true
  toK8S: false
  k8sPrefix: null
  consulPrefix: null
  
  # Service sync
  default: true
  
  # Namespace mirroring
  consulNamespaces:
    mirroringK8S: true
    mirroringK8SPrefix: ""

# Controller (for CRDs)
controller:
  enabled: true
  
  # Resource limits
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

